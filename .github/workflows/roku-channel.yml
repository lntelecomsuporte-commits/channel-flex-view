name: Build Roku Channel

on:
  push:
    branches: [main]
    paths:
      - 'roku/**'
      - '.github/workflows/roku-channel.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Package Roku channel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from run number
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Package Roku channel
        run: |
          mkdir -p out
          sed -i "s/^build_version=.*/build_version=${VERSION_CODE}/" roku/manifest
          sed -i "s/^minor_version=.*/minor_version=${{ github.run_number }}/" roku/manifest
          grep -E "^(major|minor|build)_version" roku/manifest
          (cd roku && zip -r "../out/lntv-roku.zip" manifest source components images)
          ls -lh out/lntv-roku.zip

      - name: Generate roku-version.json
        run: |
          cat > out/roku-version.json <<EOF
          {
            "rokuVersionCode": ${VERSION_CODE},
            "rokuVersionName": "${VERSION_NAME}",
            "rokuUrl": "https://tv2.lntelecom.net/downloads/lntv-roku.zip",
            "rokuNotes": "Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"
          }
          EOF
          cat out/roku-version.json

      - name: Upload Roku artifact
        uses: actions/upload-artifact@v4
        with:
          name: lntv-roku
          path: |
            out/lntv-roku.zip
            out/roku-version.json
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: roku-v${{ env.VERSION_NAME }}
          name: LN TV Roku v${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          body: |
            Build Roku #${{ github.run_number }}
            Commit: ${{ github.event.head_commit.message }}

            Sideload via http://<ip-do-roku>/ → Upload
          files: |
            out/lntv-roku.zip
            out/roku-version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
