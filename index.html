  <body>
    <div id="root"></div>

    <!-- Boot stepper + global error overlay (roda ANTES do bundle React).
         Em TV boxes Android antigos qualquer crash do bundle vira tela preta
         sem feedback nenhum. Esse script garante que o usuário SEMPRE veja
         alguma mensagem na tela: "Carregando…" no boot e erro vermelho se
         algo quebrar. Use window.__LNTV_BOOT__('rótulo') do React. -->
    <div id="lntv-boot" style="position:fixed;left:0;right:0;bottom:0;padding:6px 10px;font:12px/1.3 monospace;color:#fff;background:rgba(0,0,0,.65);z-index:2147483646;pointer-events:none">
      <span id="lntv-boot-step">boot: html</span>
      <span id="lntv-boot-ver" style="float:right;opacity:.6"></span>
    </div>
    <div id="lntv-err" style="display:none;position:fixed;inset:0;padding:16px;font:13px/1.4 monospace;color:#fff;background:#7f1d1d;z-index:2147483647;overflow:auto;white-space:pre-wrap;word-break:break-word"></div>
    <script>
      // Polyfills para WebView antigo (Android TV box Chrome < 92).
      // crypto.randomUUID só existe a partir do Chrome 92 — sem isso o React
      // crasha no boot. Implementa via getRandomValues (RFC 4122 v4).
      (function () {
        try {
          var c = window.crypto || window.msCrypto;
          if (c && !c.randomUUID) {
            c.randomUUID = function () {
              var b = new Uint8Array(16);
              c.getRandomValues(b);
              b[6] = (b[6] & 0x0f) | 0x40;
              b[8] = (b[8] & 0x3f) | 0x80;
              var h = [];
              for (var i = 0; i < 256; i++) h[i] = (i + 0x100).toString(16).slice(1);
              return h[b[0]]+h[b[1]]+h[b[2]]+h[b[3]]+'-'+h[b[4]]+h[b[5]]+'-'+h[b[6]]+h[b[7]]+'-'+h[b[8]]+h[b[9]]+'-'+h[b[10]]+h[b[11]]+h[b[12]]+h[b[13]]+h[b[14]]+h[b[15]];
            };
          }
          if (!window.crypto) window.crypto = c;
        } catch (e) {}
      })();
      (function () {
        var stepEl = document.getElementById('lntv-boot-step');
        var verEl = document.getElementById('lntv-boot-ver');
        var errEl = document.getElementById('lntv-err');
        var bootEl = document.getElementById('lntv-boot');
        var bootDone = false;
        try { verEl.textContent = (navigator.userAgent || '').slice(0, 80); } catch (e) {}
        window.__LNTV_BOOT__ = function (label) {
          try { stepEl.textContent = 'boot: ' + label; } catch (e) {}
          if (label === 'ready') {
            bootDone = true;
            try { bootEl.style.display = 'none'; } catch (e) {}
          }
        };
        function show(title, detail) {
          // Depois do boot, NÃO derruba a tela com overlay vermelho —
          // erros runtime do app são tratados pelo ErrorBoundary do React.
          // Aqui o overlay só serve pra debugar tela preta no boot.
          if (bootDone) {
            try { console.error('[LNTV runtime]', title, detail); } catch (e) {}
            return;
          }
          try {
            errEl.style.display = 'block';
            errEl.textContent =
              'LN TV — erro no boot\n===================\n' +
              'Etapa: ' + (stepEl && stepEl.textContent) + '\n' +
              'UA: ' + (navigator.userAgent || '?') + '\n\n' +
              title + '\n\n' + (detail || '');
          } catch (e) {}
        }
        window.addEventListener('error', function (ev) {
          var msg = (ev && ev.message) || 'window error';
          var src = (ev && ev.filename) ? (' @ ' + ev.filename + ':' + ev.lineno + ':' + ev.colno) : '';
          var stack = ev && ev.error && ev.error.stack ? ev.error.stack : '';
          show(msg + src, stack);
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev && ev.reason;
          var msg = (r && (r.message || (r.toString && r.toString()))) || 'unhandled promise rejection';
          var stack = (r && r.stack) || '';
          show('Promise: ' + msg, stack);
        });
        // Watchdog: se em 15s o React não chamou __LNTV_BOOT__('ready'),
        // destaca a etapa travada (mantém app rodando — não derruba nada).
        setTimeout(function () {
          if (stepEl && stepEl.textContent !== 'boot: ready') {
            try {
              bootEl.style.background = 'rgba(127,29,29,.85)';
              stepEl.textContent = 'boot TRAVADO em: ' + (stepEl.textContent || '?').replace(/^boot: /, '');
            } catch (e) {}
          }
        }, 15000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
